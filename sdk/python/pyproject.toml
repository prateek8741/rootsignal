[project]
name = "rootsignal"
version = "0.1.0.dev0"
description = "Rootsignal SDK: OpenTelemetry-based tracing for AI agents"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootsignal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
