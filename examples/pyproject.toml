[project]
name = "rootsignal-examples"
version = "0.1.0.dev0"
description = "Example agents instrumented with Rootsignal (used by demos and replay tests)"
requires-python = ">=3.10"
dependencies = ["rootsignal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootsignal_examples"]
